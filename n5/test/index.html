<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT N5 全方位單字練習（翻卡發音・聽力測驗・模擬真人版）</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* 頂部導覽列 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary-dark);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .pill.green { background: var(--success-bg); color: var(--success); }
    .pill.amber { background: var(--warning-bg); color: var(--warning); }

    .mode-tabs {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .tab-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: #f8fafc; }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .container {
      max-width: 980px;
      margin: 18px auto 60px;
      padding: 0 16px;
    }

    /* 控制篩選面板 & 語音面板 */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .panel-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.88rem;
    }

    select, input[type="text"], input[type="password"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.88rem;
      background: #fff;
      color: var(--text);
    }

    .btn {
      padding: 7px 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.accent:hover { background: #0369a1; }
    .btn.success { background: var(--success-bg); color: var(--success); border-color: #86efac; }
    .btn.warning { background: var(--warning-bg); color: var(--warning); border-color: #fde68a; }
    .btn.active-toggle { background: #0f172a; color: #fff; border-color: #0f172a; }

    .voice-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 0.86rem;
    }
    .voice-drawer.open { display: block; }

    .voice-tip {
      margin-top: 8px;
      padding: 8px 10px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      color: #0369a1;
      font-size: 0.82rem;
    }

    /* =========================
       3D 翻卡模式樣式
       ========================= */
    .flashcard-stage {
      perspective: 1200px;
      max-width: 680px;
      margin: 16px auto;
    }

    .flashcard {
      position: relative;
      width: 100%;
      min-height: 360px;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border-color: #bfdbfe;
    }

    .card-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .cat-badge {
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .card-center {
      text-align: center;
      margin: auto 0;
      padding: 12px 0;
    }

    .word-main {
      font-size: 2.6rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
      word-break: keep-all;
    }

    .word-kana {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 6px;
    }

    .word-note {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.82rem;
      color: #475569;
      background: #f1f5f9;
      padding: 2px 10px;
      border-radius: 6px;
    }

    .meaning-zh {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }

    .back-jp-small {
      font-size: 1.05rem;
      color: #334155;
      margin-bottom: 14px;
    }

    .example-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      margin-top: 8px;
    }

    .ex-jp {
      font-size: 1.04rem;
      font-weight: 600;
      color: #0f172a;
    }

    .ex-zh {
      font-size: 0.9rem;
      color: #475569;
      margin-top: 3px;
    }

    .card-bottom-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }

    .flip-hint {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .nav-deck {
      max-width: 680px;
      margin: 14px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* =========================
       測驗模式樣式
       ========================= */
    .quiz-card {
      max-width: 720px;
      margin: 16px auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .quiz-question-box {
      text-align: center;
      padding: 18px 10px;
      margin-bottom: 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .quiz-prompt-big {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
    }

    .quiz-prompt-sub {
      font-size: 1rem;
      color: var(--accent);
      margin-top: 4px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 600px) {
      .quiz-options { grid-template-columns: 1fr; }
      .word-main { font-size: 2rem; }
      .flashcard { min-height: 390px; }
    }

    .q-opt {
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
      color: var(--text);
    }

    .q-opt:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .q-opt-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .q-opt.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: #14532d;
      font-weight: 700;
    }
    .q-opt.correct .q-opt-num { background: var(--success); color: #fff; }

    .q-opt.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
    }
    .q-opt.wrong .q-opt-num { background: var(--danger); color: #fff; }

    .quiz-feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.ok { background: var(--success-bg); border: 1px solid #bbf7d0; }
    .quiz-feedback.bad { background: var(--danger-bg); border: 1px solid #fecaca; }

    /* =========================
       單字總表模式樣式
       ========================= */
    .vocab-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 12px;
    }

    .vocab-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }

    .vocab-item.mastered { border-left: 4px solid var(--success); }
    .vocab-item.review { border-left: 4px solid var(--warning); }

    .vi-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .vi-word { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
    .vi-kana { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
    .vi-zh { font-size: 1rem; font-weight: 700; color: var(--primary-dark); margin-top: 2px; }
    .vi-ex { font-size: 0.84rem; color: #475569; background: #f8fafc; padding: 7px 9px; border-radius: 6px; }
    .vi-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand">
          <h1>🇯🇵 JLPT N5 全單字練習庫（255 詞・翻卡即發音・模擬真人聲線）</h1>
        </div>
        <div class="stats-bar">
          <span class="pill" id="totalCountPill">總單字 255</span>
          <span class="pill green" id="masteredPill">✅ 已熟記 0</span>
          <span class="pill amber" id="reviewPill">🔁 待複習 0</span>
        </div>
      </div>

      <div class="mode-tabs">
        <div class="tab-group">
          <button class="tab-btn active" id="tab-flash" onclick="switchMode('flash')">🃏 翻卡背單字</button>
          <button class="tab-btn" id="tab-quiz" onclick="switchMode('quiz')">✍️ 互動測驗練習</button>
          <button class="tab-btn" id="tab-list" onclick="switchMode('list')">📖 單字總表一覽</button>
        </div>
        <div class="tab-group">
          <button class="btn" onclick="toggleVoiceDrawer()">🎙️ 模擬真人發音設定</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 全域篩選與真人語音設定面板 -->
    <section class="panel">
      <div class="panel-row">
        <div class="control-group">
          <label><b>分類篩選：</b>
            <select id="categorySelect" onchange="onFilterChange()"></select>
          </label>
          <label><b>熟記篩選：</b>
            <select id="statusSelect" onchange="onFilterChange()">
              <option value="all">全部單字</option>
              <option value="review">只看「待複習」</option>
              <option value="unmastered">只看「尚未熟記」</option>
              <option value="mastered">只看「已熟記」</option>
            </select>
          </label>
        </div>
        <div class="control-group" id="speakingStatus" style="color:var(--accent); font-weight:600;"></div>
      </div>

      <!-- 模擬真人發音引擎設定抽屜 -->
      <div class="voice-drawer" id="voiceDrawer">
        <div class="control-group" style="margin-bottom:8px;">
          <label><b>發音引擎：</b>
            <select id="engineModeSelect" onchange="onEngineChange(this.value)">
              <option value="browser">免費・瀏覽器真人神經語音（優先鎖定 Natural / Google 日本語）</option>
              <option value="voicevox">免費・本機 VOICEVOX AI 聲優（需先開啟 VOICEVOX 軟體）</option>
              <option value="openai">進階・OpenAI 真人主播級 TTS（需 API Key）</option>
            </select>
          </label>
          <label><b>語速：</b>
            <select id="rateSelect">
              <option value="0.75">0.75x 慢速清晰</option>
              <option value="0.95" selected>0.95x 真人自然</option>
              <option value="1.1">1.10x 流利</option>
            </select>
          </label>
        </div>

        <div class="control-group" id="browserVoiceRow">
          <label><b>日語聲線：</b>
            <select id="browserVoiceSelect" onchange="selectedVoiceURI = this.value"></select>
          </label>
          <button class="btn" onclick="testSampleVoice()">🔊 試聽發音</button>
        </div>

        <div class="control-group" id="voicevoxRow" style="display:none;">
          <label><b>VOICEVOX 角色：</b>
            <select id="voicevoxSpeakerSelect">
              <option value="2">四国めたん（自然溫柔女聲）</option>
              <option value="3">ずんだもん（清晰活力聲線）</option>
              <option value="8">春日部つむぎ（明亮女聲）</option>
              <option value="13">青山龍星（沉穩男聲）</option>
              <option value="11">玄野武宏（自然男聲）</option>
            </select>
          </label>
          <button class="btn" onclick="testSampleVoice()">🔊 試聽 VOICEVOX</button>
        </div>

        <div class="control-group" id="openaiRow" style="display:none;">
          <label><b>OpenAI API Key：</b>
            <input type="password" id="openaiKeyInput" placeholder="sk-..." oninput="openAiKey = this.value.trim()" />
          </label>
          <label><b>聲線：</b>
            <select id="openaiVoiceSelect">
              <option value="nova">Nova（自然女聲）</option>
              <option value="shimmer">Shimmer（清晰女聲）</option>
              <option value="onyx">Onyx（沉穩男聲）</option>
            </select>
          </label>
          <button class="btn" onclick="testSampleVoice()">🔊 試聽 AI 語音</button>
        </div>

        <div class="voice-tip">
          💡 <b>真人發音小提示：</b>本網頁在單字發音時會優先採用正確假名讀音，避免電腦誤讀日文多音漢字！若使用 Windows 電腦，推薦以 <b>Microsoft Edge</b> 開啟，系統會自動啟用 <b>★ Microsoft Nanami Online (Natural)</b> 等級的真人神經網路語音。
        </div>
      </div>
    </section>

    <!-- 動態模式內容區 -->
    <div id="modeContent"></div>
  </main>

  <script>
    // ==========================================
    // 1. JLPT N5 核心單字總庫（255 詞，11 大類）
    // 格式：[id, 單字表記, 假名讀音, 中文意思, 分類, 詞性備註, 日文例句, 中文例句]
    // ==========================================
    const VOCAB_RAW = [
      // 一、問候與生活用語 (15)
      [1,"おはようございます","おはようございます","早安（敬語）","問候與生活用語","挨拶","先生、おはようございます。","老師，早安。"],
      [2,"こんにちは","こんにちは","你好／午安","問候與生活用語","挨拶","田中さん、こんにちは。","田中先生，你好。"],
      [3,"こんばんは","こんばんは","晚上好（見面）","問候與生活用語","挨拶","皆さん、こんばんは。","各位，晚上好。"],
      [4,"おやすみなさい","おやすみなさい","晚安（睡前道別）","問候與生活用語","挨拶","もう十時ですね。おやすみなさい。","已經十點了呢，晚安。"],
      [5,"ありがとうございます","ありがとうございます","謝謝（敬語）","問候與生活用語","挨拶","手伝ってくれて、ありがとうございます。","謝謝你的幫忙。"],
      [6,"すみません","すみません","不好意思／對不起","問候與生活用語","挨拶","すみません、駅はどこですか。","不好意思，請問車站在哪裡？"],
      [7,"ごめんなさい","ごめんなさい","對不起（較口語）","問候與生活用語","挨拶","遅れて、ごめんなさい。","遲到了，對不起。"],
      [8,"いただきます","いただきます","我要開動了","問候與生活用語","挨拶","ご飯を食べる前に、「いただきます」と言います。","吃飯前會說「我要開動了」。"],
      [9,"ごちそうさまでした","ごちそうさまでした","我吃飽了／謝謝款待","問候與生活用語","挨拶","とても美味しかったです。ごちそうさまでした。","非常好吃，謝謝款待。"],
      [10,"さようなら","さようなら","再見","問候與生活用語","挨拶","先生、さようなら。また明日。","老師再見，明天見。"],
      [11,"はじめまして","はじめまして","初次見面","問候與生活用語","挨拶","はじめまして、台湾から来ました。","初次見面，我從台灣來。"],
      [12,"よろしくお願いします","よろしくおねがいします","請多多指教","問候與生活用語","挨拶","これからよろしくお願いします。","今後請多多指教。"],
      [13,"いってきます","いってきます","我出門了","問候與生活用語","挨拶","お母さん、学校へ行ってきます。","媽媽，我去上學了（我出門了）。"],
      [14,"ただいま","ただいま","我回來了","問候與生活用語","挨拶","ただいま帰りました。","我回來了。"],
      [15,"おかえりなさい","おかえりなさい","歡迎回家","問候與生活用語","挨拶","おかえりなさい。疲れたでしょう。","歡迎回來，累了吧。"],

      // 二、數字・時間・日期 (32)
      [16,"一（いち）","いち","一（1）","數字・時間・日期","數字","一から十まで数えます。","從一數到十。"],
      [17,"二（に）","に","二（2）","數字・時間・日期","數字","二番のバスに乗ります。","搭二號公車。"],
      [18,"三（さん）","さん","三（3）","數字・時間・日期","數字","三時に会いましょう。","三點見面吧。"],

    let engineMode = "browser";

    function scoreVoice(v) {
      const n = v.name.toLowerCase();
      let s = 0;
      if (n.includes("natural") || n.includes("online")) s += 120;
      if (n.includes("nanami")) s += 90;
      if (n.includes("google")) s += 80;
      if (n.includes("enhanced") || n.includes("premium")) s += 70;
      if (n.includes("keita") || n.includes("o-ren") || n.includes("kyoko")) s += 50;
      if (n.includes("haruka") || n.includes("ichiro")) s += 15;
      return s;
    }

    function loadBrowserVoices() {
      if (!("speechSynthesis" in window)) return;
      const all = window.speechSynthesis.getVoices();
      jaVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"))
                    .sort((a, b) => scoreVoice(b) - scoreVoice(a));
      if (jaVoices.length > 0 && !selectedVoiceURI) {
        selectedVoiceURI = jaVoices[0].voiceURI;
      }
      const sel = document.getElementById("browserVoiceSelect");
      if (sel) {
        if (jaVoices.length === 0) {
          sel.innerHTML = `<option value="">未偵測到日語語音包</option>`;
        } else {
          sel.innerHTML = jaVoices.map(v => {
            const star = /natural|online|google|enhanced|premium/i.test(v.name) ? "★ " : "";
            return `<option value="${v.voiceURI}" ${v.voiceURI === selectedVoiceURI ? "selected" : ""}>${star}${v.name}</option>`;
          }).join("");
        }
      }
    }

    if ("speechSynthesis" in window) {
      loadBrowserVoices();
      window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
    }

    // 修正常見日語例句的 TTS 多音字
    function normalizeTtsText(text) {
      return text
        .replace(/九時/g, "くじ")
        .replace(/四時/g, "よじ")
        .replace(/七時/g, "しちじ")
        .replace(/何時/g, "なんじ")
        .replace(/何羽/g, "なんわ")
        .replace(/何人/g, "なんにん")
        .replace(/空きました/g, "すきました")
        .replace(/一日/g, "いちにち");
    }

    function stopSpeaking() {
      speechToken++;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      if (activeAudioEl) {
        activeAudioEl.pause();
        activeAudioEl = null;
      }
      const st = document.getElementById("speakingStatus");
      if (st) st.textContent = "";
    }

    function speakText(text) {
      return new Promise(async (resolve) => {
        stopSpeaking();
        const myToken = speechToken;
        const rate = parseFloat(document.getElementById("rateSelect")?.value || "0.95");
        const cleanText = normalizeTtsText(text);
        const st = document.getElementById("speakingStatus");
        if (st) st.textContent = "🔊 真人語音播放中...";

        try {
          if (engineMode === "voicevox") {
            const speaker = document.getElementById("voicevoxSpeakerSelect").value || "2";
            const qRes = await fetch(`http://127.0.0.1:50021/audio_query?text=${encodeURIComponent(cleanText)}&speaker=${speaker}`, { method: "POST" });
            if (!qRes.ok) throw new Error("無法連線至本機 VOICEVOX (127.0.0.1:50021)");
            const query = await qRes.json();
            query.speedScale = rate;
            const sRes = await fetch(`http://127.0.0.1:50021/synthesis?speaker=${speaker}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(query)
            });
            const blob = await sRes.blob();
            if (myToken !== speechToken) return resolve();
            await playBlobAudio(blob, myToken);
          } else if (engineMode === "openai") {
            if (!openAiKey) throw new Error("請先填入 OpenAI API Key");
            const voice = document.getElementById("openaiVoiceSelect").value || "nova";
            const res = await fetch("https://api.openai.com/v1/audio/speech", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": `Bearer ${openAiKey}` },
              body: JSON.stringify({ model: "tts-1", voice, input: cleanText, speed: rate })
            });
            if (!res.ok) throw new Error("OpenAI TTS 請求失敗");
            const blob = await res.blob();
            if (myToken !== speechToken) return resolve();
            await playBlobAudio(blob, myToken);
          } else {
            // 瀏覽器真人神經網路語音（原音高 pitch=1.0）
            if (!("speechSynthesis" in window)) throw new Error("瀏覽器不支援語音");
            await new Promise((res) => {
              const utter = new SpeechSynthesisUtterance(cleanText);
              utter.lang = "ja-JP";
              const chosen = jaVoices.find(v => v.voiceURI === selectedVoiceURI) || jaVoices[0];
              if (chosen) utter.voice = chosen;
              utter.rate = rate;
              utter.pitch = 1.0;
              utter.onend = res;
              utter.onerror = res;
              window.speechSynthesis.speak(utter);
            });
          }
        } catch (err) {
          if (st) st.textContent = "⚠️ " + (err.message || "語音播放失敗");
          setTimeout(() => { if (st && myToken === speechToken) st.textContent = ""; }, 3000);
          return resolve();
        }

        if (myToken === speechToken && st) st.textContent = "";
        resolve();
      });
    }

    function playBlobAudio(blob, token) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        activeAudioEl = audio;
        audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
        audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
        if (token !== speechToken) { URL.revokeObjectURL(url); return resolve(); }
        audio.play().catch(() => resolve());
      });
    }

    function testSampleVoice() {
      speakText("おはようございます。今日も一緒に日本語を勉強しましょう。");
    }

    function onEngineChange(val) {
      engineMode = val;
      document.getElementById("browserVoiceRow").style.display = val === "browser" ? "flex" : "none";
      document.getElementById("voicevoxRow").style.display = val === "voicevox" ? "flex" : "none";
      document.getElementById("openaiRow").style.display = val === "openai" ? "flex" : "none";
    }

    function toggleVoiceDrawer() {
      document.getElementById("voiceDrawer").classList.toggle("open");
    }

    // ==========================================
    // 4. 篩選與初始化
    // ==========================================
    function initCategories() {
      const cats = [...new Set(VOCAB.map(v => v.cat))];
      const sel = document.getElementById("categorySelect");
      sel.innerHTML = `<option value="all">全部分類（${VOCAB.length} 詞）</option>` +
        cats.map(c => {
          const cnt = VOCAB.filter(v => v.cat === c).length;
          return `<option value="${c}">${c}（${cnt}）</option>`;
        }).join("");
    }

    function getFilteredVocab() {
      return VOCAB.filter(v => {
        if (filterCat !== "all" && v.cat !== filterCat) return false;
        const st = progressMap[v.id];
        if (filterStatus === "review" && st !== "review") return false;
        if (filterStatus === "mastered" && st !== "mastered") return false;
        if (filterStatus === "unmastered" && st === "mastered") return false;
        return true;
      });
    }

    function updateTopStats() {
      const mastered = Object.values(progressMap).filter(v => v === "mastered").length;
      const review = Object.values(progressMap).filter(v => v === "review").length;
      document.getElementById("totalCountPill").textContent = `總單字 ${VOCAB.length}`;
      document.getElementById("masteredPill").textContent = `✅ 已熟記 ${mastered}`;
      document.getElementById("reviewPill").textContent = `🔁 待複習 ${review}`;
    }

    function onFilterChange() {
      stopAutoPlay();
      filterCat = document.getElementById("categorySelect").value;
      filterStatus = document.getElementById("statusSelect").value;
      if (currentMode === "flash") {
        rebuildDeck();
      } else if (currentMode === "quiz") {
        nextQuizQuestion();
      } else {
        renderListMode();
      }
    }

    function switchMode(mode) {
      stopAutoPlay();
      stopSpeaking();
      currentMode = mode;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(`tab-${mode}`).classList.add("active");
      if (mode === "flash") rebuildDeck();
      else if (mode === "quiz") nextQuizQuestion();
      else renderListMode();
    }

    // ==========================================
    // 5. 模式一：3D 翻卡背單字（翻卡即發音）
    // ==========================================
    function rebuildDeck() {
      deckList = getFilteredVocab();
      deckIndex = 0;
      isFlipped = false;
      renderFlashMode();
    }

    function shuffleDeck() {
      stopAutoPlay();
      for (let i = deckList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deckList[i], deckList[j]] = [deckList[j], deckList[i]];
      }
      deckIndex = 0;
      isFlipped = false;
      renderFlashMode();
    }

    function renderFlashMode() {
      const container = document.getElementById("modeContent");
      if (deckList.length === 0) {
        container.innerHTML = `<div class="panel" style="text-align:center; padding:40px;">目前篩選條件下沒有單字喔！請切換其他分類或狀態。</div>`;
        return;
      }
      const item = deckList[deckIndex];
      const st = progressMap[item.id];
      const stBadge = st === "mastered"
        ? `<span class="pill green">✅ 已熟記</span>`
        : st === "review"
        ? `<span class="pill amber">🔁 待複習</span>`
        : `<span class="pill">第 ${deckIndex + 1} / ${deckList.length} 張</span>`;

      let frontMain = item.word;
      let frontSub = `<div class="word-kana">${item.kana}</div>`;
      if (displayScriptMode === "kanji") {
        frontSub = `<div class="word-kana" style="color:var(--muted); font-size:0.9rem;">（已隱藏假名・翻卡揭曉讀音與發音）</div>`;
      } else if (displayScriptMode === "kana") {
        frontMain = item.kana;
        frontSub = "";
      }

      container.innerHTML = `
        <div class="panel" style="padding:10px 14px;">
          <div class="panel-row">
            <div class="control-group">
              <label>顯示：
                <select onchange="displayScriptMode=this.value; renderFlashMode();">
                  <option value="both" ${displayScriptMode==="both"?"selected":""}>漢字＋假名</option>
                  <option value="kanji" ${displayScriptMode==="kanji"?"selected":""}>只看漢字（自我考讀音）</option>
                  <option value="kana" ${displayScriptMode==="kana"?"selected":""}>只看假名</option>
                </select>
              </label>
              <label><input type="checkbox" ${autoSpeakOnFlip?"checked":""} onchange="autoSpeakOnFlip=this.checked"> 翻卡自動發音</label>
              <label><input type="checkbox" ${autoSpeakExample?"checked":""} onchange="autoSpeakExample=this.checked"> 翻卡連讀例句</label>
            </div>
            <div class="control-group">
              <button class="btn" onclick="shuffleDeck()">🔀 洗牌</button>
              <button class="btn ${autoPlayLoopRunning ? 'active-toggle' : 'accent'}" onclick="toggleAutoPlay()">
                ${autoPlayLoopRunning ? "⏹ 停止輪播" : "▶ 自動輪播背單字"}
              </button>
            </div>
          </div>
        </div>

        <div class="flashcard-stage">
          <div class="flashcard ${isFlipped ? 'is-flipped' : ''}" id="flashcardEl" onclick="flipCard()">
            <!-- 正面 -->
            <div class="card-face">
              <div class="card-top-meta">
                <span class="cat-badge">${item.cat}</span>
                <span>${stBadge}</span>
              </div>
              <div class="card-center">
                <div class="word-main">${frontMain}</div>
                ${frontSub}
                <div class="word-note">${item.note}</div>
              </div>
              <div class="card-bottom-actions">
                <button class="btn accent" onclick="event.stopPropagation(); speakText('${item.kana}')">🔊 聽單字發音</button>
                <span class="flip-hint">點擊卡片或按 [空白鍵] 翻面看解答＋發音</span>
              </div>
            </div>

            <!-- 背面 -->
            <div class="card-face card-back">
              <div class="card-top-meta">
                <span class="cat-badge">${item.cat}・${item.note}</span>
                <span>第 ${deckIndex + 1} / ${deckList.length} 張</span>
              </div>
              <div class="card-center">
                <div class="meaning-zh">${item.zh}</div>
                <div class="back-jp-small"><b>${item.word}</b>（${item.kana}）</div>
                <div class="example-box" onclick="event.stopPropagation()">
                  <div class="ex-jp">${item.exJp}</div>
                  <div class="ex-zh">${item.exZh}</div>
                  <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn accent" onclick="speakText('${item.kana}')">🔊 唸單字</button>
                    <button class="btn" onclick="speakText('${item.exJp.replace(/'/g, "\\'")}')">🔊 唸例句</button>
                  </div>
                </div>
              </div>
              <div class="card-bottom-actions" onclick="event.stopPropagation()">
                <div style="display:flex; gap:8px;">
                  <button class="btn success" onclick="markCard(${item.id}, 'mastered')">✅ 我會了（熟記）</button>
                  <button class="btn warning" onclick="markCard(${item.id}, 'review')">🔁 待複習</button>
                </div>
                <span class="flip-hint" onclick="flipCard()" style="cursor:pointer;">↺ 翻回正面</span>
              </div>
            </div>
          </div>
        </div>

        <div class="nav-deck">
          <button class="btn" onclick="moveDeck(-1)">⬅ 上一張</button>
          <span style="font-size:0.86rem; color:var(--muted);">快捷鍵：空白鍵 翻面｜R 重聽｜← → 換卡</span>
          <button class="btn primary" onclick="moveDeck(1)">下一張 ➡</button>
        </div>
      `;
    }

    async function flipCard() {
      isFlipped = !isFlipped;
      const el = document.getElementById("flashcardEl");
      if (el) el.classList.toggle("is-flipped", isFlipped);

      if (isFlipped && autoSpeakOnFlip) {
        const item = deckList[deckIndex];
        if (item) {
          await speakText(item.kana);
          if (autoSpeakExample && isFlipped && deckList[deckIndex]?.id === item.id) {
            setTimeout(() => {
              if (isFlipped && deckList[deckIndex]?.id === item.id) {
                speakText(item.exJp);
              }
            }, 350);
          }
        }
      }
    }

    function moveDeck(step) {
      if (deckList.length === 0) return;
      stopSpeaking();
      deckIndex = (deckIndex + step + deckList.length) % deckList.length;
      isFlipped = false;
      renderFlashMode();
    }

    function markCard(id, status) {
      progressMap[id] = status;
      saveProgress();
      moveDeck(1);
    }

    function stopAutoPlay() {
      autoPlayLoopRunning = false;
      autoPlayToken++;
    }

    async function toggleAutoPlay() {
      if (autoPlayLoopRunning) {
        stopAutoPlay();
        stopSpeaking();
        renderFlashMode();
        return;
      }
      autoPlayLoopRunning = true;
      const myLoop = ++autoPlayToken;
      renderFlashMode();

      while (autoPlayLoopRunning && myLoop === autoPlayToken && currentMode === "flash") {
        const item = deckList[deckIndex];
        if (!item) break;
        isFlipped = false;
        renderFlashMode();
        await speakText(item.kana);
        await new Promise(r => setTimeout(r, 900));
        if (!autoPlayLoopRunning || myLoop !== autoPlayToken) break;

        isFlipped = true;
        const el = document.getElementById("flashcardEl");
        if (el) el.classList.add("is-flipped");
        await speakText(item.exJp);
        await new Promise(r => setTimeout(r, 1100));
        if (!autoPlayLoopRunning || myLoop !== autoPlayToken) break;

        deckIndex = (deckIndex + 1) % deckList.length;
      }
    }

    // 鍵盤快捷鍵
    document.addEventListener("keydown", (e) => {
      if (currentMode !== "flash") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        stopAutoPlay();
        moveDeck(1);
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        stopAutoPlay();
        moveDeck(-1);
      } else if (e.key === "r" || e.key === "R") {
        const item = deckList[deckIndex];
        if (item) speakText(item.kana);
      }
    });

    // ==========================================
    // 6. 模式二：互動測驗練習（看字／聽音）
    // ==========================================
    function nextQuizQuestion() {
      const pool = getFilteredVocab();
      const container = document.getElementById("modeContent");
      if (pool.length < 4) {
        container.innerHTML = `<div class="panel" style="text-align:center; padding:40px;">測驗模式至少需要 4 個單字，目前篩選結果僅 ${pool.length} 個，請放寬篩選條件。</div>`;
        return;
      }

      const target = pool[Math.floor(Math.random() * pool.length)];
      // 優先從同分類抓干擾項，不夠再從全題庫補
      const sameCatPool = VOCAB.filter(v => v.id !== target.id && v.cat === target.cat);
      const otherPool = VOCAB.filter(v => v.id !== target.id && v.cat !== target.cat);
      const distractors = [];
      const shuffledSame = [...sameCatPool].sort(() => Math.random() - 0.5);
      const shuffledOther = [...otherPool].sort(() => Math.random() - 0.5);

      for (const d of [...shuffledSame, ...shuffledOther]) {
        if (distractors.length >= 3) break;
        if (d.zh !== target.zh && !distractors.some(x => x.zh === d.zh)) {
          distractors.push(d);
        }
      }

      quizItem = target;
      quizOptions = [target, ...distractors].sort(() => Math.random() - 0.5);
      quizAnswered = false;
      quizUserPick = null;

      renderQuizMode();
      if (quizType === "listen") {
        setTimeout(() => speakText(quizItem.kana), 150);
      }
    }

    function renderQuizMode() {
      const container = document.getElementById("modeContent");
      if (!quizItem) return;

      let promptHTML = "";
      if (quizType === "jp2zh") {
        promptHTML = `
          <div class="quiz-prompt-big">${quizItem.word}</div>
          <div class="quiz-prompt-sub">${quizItem.kana}　<button class="btn" style="padding:3px 8px; font-size:0.8rem;" onclick="speakText('${quizItem.kana}')">🔊 發音</button></div>
        `;
      } else if (quizType === "zh2jp") {
        promptHTML = `
          <div class="quiz-prompt-big">${quizItem.zh}</div>
          <div class="quiz-prompt-sub">${quizItem.cat}・${quizItem.note}</div>
        `;
      } else {
        promptHTML = `
          <div style="margin-bottom:8px; font-size:1rem; color:var(--muted);">請聽發音，選出正確的單字與中文意思：</div>
          <button class="btn accent" style="font-size:1.05rem; padding:10px 20px;" onclick="speakText('${quizItem.kana}')">🔊 再聽一次發音</button>
        `;
      }

      const optsHTML = quizOptions.map((opt, idx) => {
        let cls = "q-opt";
        if (quizAnswered) {
          if (opt.id === quizItem.id) cls += " correct";
          else if (idx === quizUserPick) cls += " wrong";
        }
        let label = "";
        if (quizType === "jp2zh") label = opt.zh;
        else if (quizType === "zh2jp") label = `${opt.word}（${opt.kana}）`;
        else label = `${opt.word}（${opt.kana}）— ${opt.zh}`;

        return `
          <button class="${cls}" ${quizAnswered ? "disabled" : ""} onclick="answerQuiz(${idx})">
            <span class="q-opt-num">${idx + 1}</span>
            <span>${label}</span>
          </button>
        `;
      }).join("");

      const isRight = quizAnswered && quizOptions[quizUserPick].id === quizItem.id;
      const rate = quizTotal > 0 ? Math.round((quizCorrect / quizTotal) * 100) : 0;

      container.innerHTML = `
        <div class="panel" style="padding:10px 14px;">
          <div class="panel-row">
            <div class="control-group">
              <b>練習題型：</b>
              <button class="btn ${quizType==='jp2zh'?'primary':''}" onclick="quizType='jp2zh'; nextQuizQuestion();">看日文選中文</button>
              <button class="btn ${quizType==='zh2jp'?'primary':''}" onclick="quizType='zh2jp'; nextQuizQuestion();">看中文選日文</button>
              <button class="btn ${quizType==='listen'?'primary':''}" onclick="quizType='listen'; nextQuizQuestion();">🎧 聽音辨字</button>
            </div>
            <div class="control-group">
              <span class="pill">已測 ${quizTotal} 題</span>
              <span class="pill green">正確率 ${rate}%</span>
              <span class="pill amber">🔥 連對 ${quizStreak}</span>
            </div>
          </div>
        </div>

        <div class="quiz-card">
          <div class="quiz-question-box">${promptHTML}</div>
          <div class="quiz-options">${optsHTML}</div>

          <div class="quiz-feedback ${quizAnswered ? 'show ' + (isRight ? 'ok' : 'bad') : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
              <b>${isRight ? "✅ 答對了！" : `❌ 答錯了！正確答案是：${quizItem.word}（${quizItem.kana}）＝ ${quizItem.zh}（已自動加入待複習）`}</b>
              <button class="btn primary" onclick="nextQuizQuestion()">下一題 ➡</button>
            </div>
            <div class="example-box">
              <div class="ex-jp">${quizItem.exJp}</div>
              <div class="ex-zh">${quizItem.exZh}</div>
              <div style="margin-top:8px; display:flex; gap:8px;">
                <button class="btn accent" onclick="speakText('${quizItem.kana}')">🔊 唸單字</button>
                <button class="btn" onclick="speakText('${quizItem.exJp.replace(/'/g, "\\'")}')">🔊 唸例句</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function answerQuiz(idx) {
      if (quizAnswered) return;
      quizAnswered = true;
      quizUserPick = idx;
      quizTotal++;
      const isRight = quizOptions[idx].id === quizItem.id;
      if (isRight) {
        quizCorrect++;
        quizStreak++;
      } else {
        quizStreak = 0;
        progressMap[quizItem.id] = "review";
        saveProgress();
      }
      renderQuizMode();
      speakText(quizItem.kana);
    }

    // ==========================================
    // 7. 模式三：單字總表一覽（搜尋＋一點即唸）
    // ==========================================
    function renderListMode() {
      const container = document.getElementById("modeContent");
      const baseList = getFilteredVocab();
      const q = listSearchQuery.trim().toLowerCase();
      const filtered = q
        ? baseList.filter(v =>
            v.word.toLowerCase().includes(q) ||
            v.kana.toLowerCase().includes(q) ||
            v.zh.toLowerCase().includes(q)
          )
        : baseList;

      const itemsHTML = filtered.map(v => {
        const st = progressMap[v.id] || "";
        return `
          <div class="vocab-item ${st}">
            <div>
              <div class="vi-top">
                <div>
                  <div class="vi-word">${v.word}</div>
                  <div class="vi-kana">${v.kana}</div>
                </div>
                <span class="cat-badge">${v.note}</span>
              </div>
              <div class="vi-zh">${v.zh}</div>
            </div>
            <div class="vi-ex">
              <div>${v.exJp}</div>
              <div style="color:var(--muted);">${v.exZh}</div>
            </div>
            <div class="vi-actions">
              <div style="display:flex; gap:6px;">
                <button class="btn accent" onclick="speakText('${v.kana}')">🔊 單字</button>
                <button class="btn" onclick="speakText('${v.exJp.replace(/'/g, "\\'")}')">🔊 例句</button>
              </div>
              <div style="display:flex; gap:5px;">
                <button class="btn ${st==='mastered'?'success':''}" onclick="toggleListStatus(${v.id}, 'mastered')">✅</button>
                <button class="btn ${st==='review'?'warning':''}" onclick="toggleListStatus(${v.id}, 'review')">🔁</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="panel" style="padding:10px 14px;">
          <div class="panel-row">
            <div class="control-group">
              <b>🔍 搜尋單字：</b>
              <input type="text" id="listSearchInput" placeholder="輸入漢字、假名或中文..." value="${listSearchQuery}" oninput="listSearchQuery=this.value; renderListModeKeepFocus();" style="width:240px;" />
            </div>
            <span style="font-size:0.86rem; color:var(--muted);">顯示 ${filtered.length} 個單字</span>
          </div>
        </div>
        <div class="vocab-list">${itemsHTML || '<div class="panel">找不到符合的單字</div>'}</div>
      `;
    }

    function renderListModeKeepFocus() {
      const val = listSearchQuery;
      renderListMode();
      const inp = document.getElementById("listSearchInput");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    function toggleListStatus(id, target) {
      if (progressMap[id] === target) delete progressMap[id];
      else progressMap[id] = target;
      saveProgress();
      renderListMode();
    }

    // 啟動初始化
    initCategories();
    updateTopStats();
    rebuildDeck();
  </script>
</body>
</html>
