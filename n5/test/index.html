<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT N5 核心能力模擬測驗（50題・模擬真人聽力版）</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      padding: 12px 16px;
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 1.12rem;
      color: var(--primary-dark);
    }

    .score-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.88rem;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .badge.green { background: var(--success-bg); color: var(--success); }
    .badge.red { background: var(--danger-bg); color: var(--danger); }

    .progress-wrap {
      margin-top: 8px;
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #16a34a);
      transition: width 0.3s ease;
    }

    .nav-controls {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .nav-tabs, .filter-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-sm {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sm:hover { background: #f1f5f9; }
    .btn-sm.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-sm.danger { color: var(--danger); border-color: #fecaca; }
    .btn-sm.danger:hover { background: var(--danger-bg); }

    .container {
      max-width: 920px;
      margin: 20px auto 60px;
      padding: 0 16px;
    }

    .section-banner {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      margin: 28px 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-banner h2 { margin: 0; font-size: 1.1rem; }
    .section-banner span { font-size: 0.85rem; opacity: 0.92; }

    /* 語音引擎控制台 */
    .voice-panel {
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-left: 5px solid #0284c7;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 0.9rem;
    }

    .voice-panel-title {
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .voice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .voice-select, .api-input {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
      max-width: 100%;
    }

    .voice-tip {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #475569;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .passage-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 5px solid var(--warning);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      font-size: 1.02rem;
      line-height: 1.9;
    }

    .passage-title {
      font-weight: 700;
      color: #92400e;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s;
    }

    .q-card.correct-card { border-color: #86efac; }
    .q-card.wrong-card { border-color: #fca5a5; }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .q-num {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 2px 9px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .q-tag {
      font-size: 0.78rem;
      color: var(--muted);
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .q-prompt {
      font-size: 1.08rem;
      font-weight: 500;
      margin: 6px 0 14px;
    }

    .q-prompt u {
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
      text-decoration-color: var(--primary);
    }

    .audio-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn-play {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play:hover { background: #0369a1; }

    .btn-stop {
      background: #fff;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .speed-select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      background: #fff;
    }

    .audio-status {
      font-size: 0.85rem;
      color: #0369a1;
      font-weight: 600;
    }

    .transcript-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #bae6fd;
      font-size: 0.92rem;
      color: #334155;
      display: none;
    }

    .transcript-box.show { display: block; }
    .transcript-line { margin: 4px 0; }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .opt-btn {
      text-align: left;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 9px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .opt-btn:disabled { cursor: default; }

    .opt-index {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .opt-btn.is-correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: #14532d;
      font-weight: 600;
    }

    .opt-btn.is-correct .opt-index { background: var(--success); color: #fff; }

    .opt-btn.is-wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: #7f1d1d;
    }

    .opt-btn.is-wrong .opt-index { background: var(--danger); color: #fff; }

    .feedback-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 0.93rem;
      display: none;
    }

    .feedback-box.show { display: block; animation: fadeIn 0.2s ease; }
    .feedback-box.correct { background: var(--success-bg); border: 1px solid #bbf7d0; }
    .feedback-box.wrong { background: var(--danger-bg); border: 1px solid #fecaca; }

    .feedback-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .retry-btn {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      color: #475569;
    }

    .retry-btn:hover { background: #f1f5f9; }

    .summary-card {
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 22px;
      margin-top: 32px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.08);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .summary-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .summary-item .sec-name { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .summary-item .sec-score { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="sticky-header">
    <div class="header-inner">
      <div class="top-row">
        <div class="title-area">
          <h1>🇯🇵 JLPT N5 核心能力模擬測驗（50 題・模擬真人聽力版）</h1>
        </div>
        <div class="score-badges">
          <span class="badge" id="answeredBadge">已答 0 / 50</span>
          <span class="badge green" id="correctBadge">答對 0 題</span>
          <span class="badge red" id="wrongBadge">答錯 0 題</span>
          <span class="badge" id="rateBadge">正確率 0%</span>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="nav-controls">
        <div class="nav-tabs">
          <button class="btn-sm" onclick="jumpTo('sec-1')">一、文字語彙 (12)</button>
          <button class="btn-sm" onclick="jumpTo('sec-2')">二、文法句型 (16)</button>
          <button class="btn-sm" onclick="jumpTo('sec-3')">三、句子重組 (6)</button>
          <button class="btn-sm" onclick="jumpTo('sec-4')">四、短文閱讀 (6)</button>
          <button class="btn-sm" onclick="jumpTo('sec-5')">五、聽力測驗 (10)</button>
          <button class="btn-sm" onclick="jumpTo('summarySection')">📊 成績分析</button>
        </div>
        <div class="filter-btns">
          <button class="btn-sm active" id="filter-all" onclick="setFilter('all')">全部</button>
          <button class="btn-sm" id="filter-unanswered" onclick="setFilter('unanswered')">未答</button>
          <button class="btn-sm" id="filter-wrong" onclick="setFilter('wrong')">只看錯題</button>
          <button class="btn-sm danger" onclick="resetAll()">↺ 全部重測</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="quizRoot"></div>

    <section id="summarySection" class="summary-card">
      <h2 style="margin-top:0;">📊 測驗即時成績單</h2>
      <p id="summaryText" style="color: var(--muted); margin-bottom: 10px;">
        作答任一題後即可立即顯示對錯與詳解，系統會在此為您即時統計各單元表現。
      </p>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>
  </main>

  <script>
    // ==========================================
    // 1. 題庫資料（完全對應 N5 單字文法整理教材，共 50 題）
    // ==========================================
    const SECTIONS = [
      { id: "sec-1", title: "一、文字・語彙（第 1～12 題）", desc: "時間方位、家人稱謂、助數詞、自他動詞、易混淆形容詞、外來語" },
      { id: "sec-2", title: "二、文法・句型（第 13～28 題）", desc: "14 大核心助詞、存在句、意願許可、過去經驗、高頻文法陷阱" },
      { id: "sec-3", title: "三、句子重組 ★（第 29～34 題）", desc: "請排出正確語序，選出應填入「★」位置的選項" },
      { id: "sec-4", title: "四、短文閱讀 読解（第 35～40 題）", desc: "請閱讀短文後回答問題" },
      { id: "sec-5", title: "五、聽力測驗 聴解（第 41～50 題）", desc: "模擬真人男女聲線＋JLPT考場提示音＋漢字正音校正" }
    ];

    const PASSAGES = {
      p1: {
        title: "【短文一】（第 35～37 題）",
        text: "　昨日、私は　友達の　田中さんと　レストランへ　行きました。そのレストランは　ホテルの　前に　あります。とても　きれいな　レストランでした。<br>　田中さんは　ケーキを　食べました。私は　ケーキより　寿司が　食べたかったですから、寿司を　食べました。コーヒーも　飲みました。少し　高かったですが、とても　美味しかったです。<br>　私たちは　午後一時から　三時まで　レストランに　いました。"
      },
      p2: {
        title: "【短文二】（第 38～40 題）",
        text: "　私の　家族は　四人です。父と　母と　弟と　私です。父は　先生です。毎日　車で　学校へ　行きます。母は　料理（りょうり）が　上手です。<br>　私の　部屋には　大きい　パソコンが　一台　あります。弟の　部屋には　テレビが　あります。弟は　今、部屋で　テレビを　見ています。でも、夜　十時からは　テレビを　見ては　いけません。十時に　寝ますから。"
      }
    };

    const QUESTIONS = [
      // 一、文字・語彙 (1-12)
      {
        id: 1, section: "sec-1", tag: "時間詞讀音",
        prompt: "<u>昨日</u>、友達と　映画（えいが）を　見ました。",
        options: ["きょう", "あした", "きのう", "らいげつ"],
        answer: 2,
        explanation: "「昨日」讀作「きのう」（きょう＝今日、あした＝明日、らいげつ＝来月）。"
      },
      {
        id: 2, section: "sec-1", tag: "方位詞漢字",
        prompt: "机（つくえ）の　<u>うえ</u>に　本が　あります。",
        options: ["下", "上", "前", "中"],
        answer: 1,
        explanation: "「うえ」的漢字是「上」（した＝下、まえ＝前、なか＝中）。"
      },
      {
        id: 3, section: "sec-1", tag: "家族稱謂",
        prompt: "私は　<u>あね</u>が　一人　います。",
        options: ["姉", "妹", "兄", "母"],
        answer: 0,
        explanation: "「あね」是稱呼自己的姊姊，漢字為「姉」（いもうと＝妹、あに＝兄、はは＝母）。"
      },
      {
        id: 4, section: "sec-1", tag: "方位詞漢字",
        prompt: "教室の　<u>そと</u>に　学生が　います。",
        options: ["中", "前", "後ろ", "外"],
        answer: 3,
        explanation: "「そと」的漢字為「外」（なか＝中、まえ＝前、うしろ＝後ろ）。"
      },
      {
        id: 5, section: "sec-1", tag: "時間詞漢字",
        prompt: "<u>らいげつ</u>、日本へ　旅行します。",
        options: ["今週", "昨日", "明日", "来月"],
        answer: 3,
        explanation: "「らいげつ」對應漢字為「来月」（下個月）。"
      },
      {
        id: 6, section: "sec-1", tag: "形容詞易混淆",
        prompt: "八月（はちがつ）の　日本は　とても（　　）です。",
        options: ["暑い", "熱い", "きれい", "静か"],
        answer: 0,
        explanation: "「暑い」指天氣熱（八月氣候炎熱）；「熱い」則指物體觸覺燙。"
      },
      {
        id: 7, section: "sec-1", tag: "形容詞易混淆",
        prompt: "このコーヒーは　とても（　　）ですから、気をつけて　飲んでください。",
        options: ["暑い", "熱い", "寒い", "静か"],
        answer: 1,
        explanation: "咖啡很燙，屬於觸覺或飲食溫度，必須使用「熱い」。"
      },
      {
        id: 8, section: "sec-1", tag: "生活用語",
        prompt: "食事が　終わりました。「（　　）」と　言います。",
        options: ["いただきます", "ごちそうさまでした", "おはようございます", "おやすみなさい"],
        answer: 1,
        explanation: "吃飽後要說「ごちそうさまでした」（謝謝款待）；開動前才說「いただきます」。"
      },
      {
        id: 9, section: "sec-1", tag: "自稱與他稱",
        prompt: "A：「田中さんの（　　）は　お元気ですか。」<br>B：「はい、母は　とても　元気です。」",
        options: ["母", "お父さん", "お母さん", "姉"],
        answer: 2,
        explanation: "詢問別人的母親要用敬稱「お母さん」，對方回答自己母親才用「母」。"
      },
      {
        id: 10, section: "sec-1", tag: "和語計數",
        prompt: "りんごを（　　）　買いました。（買了三個蘋果）",
        options: ["三つ", "三枚", "三本", "三冊"],
        answer: 0,
        explanation: "蘋果等一般物品常用和語計數法「一つ、二つ、三つ（みっつ）……」。"
      },
      {
        id: 11, section: "sec-1", tag: "常用助數詞",
        prompt: "ペン（筆）を　二（　　）と、紙（かみ）を　五（　　）　ください。",
        options: ["本／枚", "枚／本", "台／冊", "冊／枚"],
        answer: 0,
        explanation: "細長形物品（筆）用「～本」，薄片狀物品（紙）用「～枚」。"
      },
      {
        id: 12, section: "sec-1", tag: "自動詞與他動詞",
        prompt: "教室の　ドアが（　　）います。だれが　開けましたか。",
        options: ["開けて", "開いて", "閉めて", "閉まって"],
        answer: 1,
        explanation: "前面助詞是「が」，須接自動詞「開く（開いて）」，表示「門正開著」；後句問誰打開的，故選開著。"
      },

      // 二、文法・句型 (13-28)
      {
        id: 13, section: "sec-2", tag: "助詞 ～で",
        prompt: "私は　毎日　図書館（　　）　勉強します。",
        options: ["に", "で", "へ", "を"],
        answer: 1,
        explanation: "動作發生的場所（在圖書館唸書）使用助詞「で」。"
      },
      {
        id: 14, section: "sec-2", tag: "助詞 ～へ",
        prompt: "田中さんは　来月　日本（　　）　行きます。",
        options: ["を", "で", "へ", "が"],
        answer: 2,
        explanation: "表示移動的方向（去日本）使用助詞「へ」。"
      },

    // ==========================================
    // 2. 擬真語音引擎設定（瀏覽器 Natural 神經語音 + 選用 OpenAI TTS）
    // ==========================================
    const userAnswers = {};
    let currentFilter = "all";
    let jaVoices = [];
    let selectedFemaleVoiceURI = "";
    let selectedMaleVoiceURI = "";
    let engineMode = "browser"; // "browser" | "openai"
    let openAiKey = "";
    let activePlayToken = 0;
    let currentAudioEl = null;
    let audioCtx = null;

    // 語音優先權排序：把微軟 Natural Online、Google 日本語、Apple 強化聲線排最前面
    function scoreVoice(voice, targetGender) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (name.includes("natural") || name.includes("online")) score += 100;
      if (name.includes("google")) score += 80;
      if (name.includes("enhanced") || name.includes("premium")) score += 70;

      if (targetGender === "female") {
        if (name.includes("nanami")) score += 60;
        if (name.includes("o-ren") || name.includes("kyoko")) score += 45;
        if (name.includes("ayumi") || name.includes("sayaka")) score += 40;
        if (name.includes("haruka")) score += 20;
        if (name.includes("keita") || name.includes("hattori") || name.includes("otoya") || name.includes("ichiro")) score -= 50;
      } else {
        if (name.includes("keita")) score += 60;
        if (name.includes("hattori") || name.includes("otoya")) score += 45;
        if (name.includes("ichiro")) score += 25;
        if (name.includes("nanami") || name.includes("o-ren") || name.includes("kyoko") || name.includes("haruka")) score -= 50;
      }
      return score;
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      const all = window.speechSynthesis.getVoices();
      jaVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));

      if (jaVoices.length > 0) {
        if (!selectedFemaleVoiceURI) {
          const sortedF = [...jaVoices].sort((a, b) => scoreVoice(b, "female") - scoreVoice(a, "female"));
          selectedFemaleVoiceURI = sortedF[0].voiceURI;
        }
        if (!selectedMaleVoiceURI) {
          const sortedM = [...jaVoices].sort((a, b) => scoreVoice(b, "male") - scoreVoice(a, "male"));
          selectedMaleVoiceURI = sortedM[0].voiceURI;
        }
      }
      populateVoiceSelectors();
    }

    function populateVoiceSelectors() {
      const fSel = document.getElementById("femaleVoiceSelect");
      const mSel = document.getElementById("maleVoiceSelect");
      if (!fSel || !mSel) return;

      if (jaVoices.length === 0) {
        fSel.innerHTML = `<option value="">未偵測到日語語音包</option>`;
        mSel.innerHTML = `<option value="">未偵測到日語語音包</option>`;
        return;
      }

      const optsHtml = (selectedURI) => jaVoices.map(v => {
        const isNatural = /natural|online|google|enhanced|premium/i.test(v.name);
        const label = `${isNatural ? "★ " : ""}${v.name}`;
        return `<option value="${v.voiceURI}" ${v.voiceURI === selectedURI ? "selected" : ""}>${label}</option>`;
      }).join("");

      fSel.innerHTML = optsHtml(selectedFemaleVoiceURI);
      mSel.innerHTML = optsHtml(selectedMaleVoiceURI);
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 使用 Web Audio API 合成清脆的 JLPT 考場提示音（叮咚）
    function playChime(type = "start") {
      return new Promise(resolve => {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;

          const playTone = (freq, startOffset, dur) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + startOffset);
            gain.gain.setValueAtTime(0.001, now + startOffset);
            gain.gain.exponentialRampToValueAtTime(0.14, now + startOffset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + startOffset);
            osc.stop(now + startOffset + dur);
          };

          if (type === "start") {
            playTone(659.25, 0, 0.18);     // E5
            playTone(880.00, 0.14, 0.28);  // A5
            setTimeout(resolve, 480);
          } else {
            playTone(783.99, 0, 0.22);     // G5（質問前小提示音）
            setTimeout(resolve, 320);
          }
        } catch (e) {
          resolve();
        }
      });
    }

    function stopAudio() {
      activePlayToken++;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      if (currentAudioEl) {
        currentAudioEl.pause();
        currentAudioEl = null;
      }
      document.querySelectorAll(".audio-status").forEach(el => el.textContent = "");
    }

    function testVoice(gender) {
      stopAudio();
      if (engineMode === "openai") {
        speakWithOpenAI(
          gender === "female" ? "こんにちは。今日はとてもいい天気ですね。" : "はじめまして。よろしくお願いします。",
          gender,
          1.0,
          activePlayToken
        );
        return;
      }
      if (!("speechSynthesis" in window) || jaVoices.length === 0) {
        alert("目前瀏覽器尚未偵測到日語語音包，建議使用 Microsoft Edge 或最新版 Chrome。");
        return;
      }
      const uri = gender === "female" ? selectedFemaleVoiceURI : selectedMaleVoiceURI;
      const voice = jaVoices.find(v => v.voiceURI === uri) || jaVoices[0];
      const text = gender === "female"
        ? "こんにちは。今日はとてもいい天気ですね。"
        : "はじめまして。これからよろしくお願いします。";
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ja-JP";
      utter.voice = voice;
      utter.rate = 0.95;
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    }

    async function speakWithOpenAI(text, gender, rate, token) {
      if (!openAiKey) {
        alert("請先在「語音引擎設定」填入 OpenAI API Key，或切換回免費瀏覽器語音。");
        return;
      }
      const voiceName = gender === "male" ? "onyx" : "nova";
      const res = await fetch("https://api.openai.com/v1/audio/speech", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${openAiKey}`
        },
        body: JSON.stringify({
          model: "tts-1",
          voice: voiceName,
          input: text,
          speed: rate
        })
      });
      if (!res.ok) throw new Error("OpenAI TTS 呼叫失敗，請確認 API Key 是否正確。");
      if (token !== activePlayToken) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      await new Promise((resolve, reject) => {
        if (token !== activePlayToken) { URL.revokeObjectURL(url); return resolve(); }
        const audio = new Audio(url);
        currentAudioEl = audio;
        audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
        audio.onerror = () => { URL.revokeObjectURL(url); reject(); };
        audio.play().catch(reject);
      });
    }

    async function playAudio(qId) {
      stopAudio();
      const q = QUESTIONS.find(item => item.id === qId);
      if (!q || !q.audioScript) return;

      const myToken = ++activePlayToken;
      const rate = parseFloat(document.getElementById(`speed-${qId}`).value) || 0.95;
      const statusEl = document.getElementById(`status-${qId}`);
      const lines = q.audioScript;

      statusEl.textContent = "♪ 準備播放...";
      await playChime("start");
      if (myToken !== activePlayToken) return;

      if (engineMode === "openai") {
        try {
          for (let i = 0; i < lines.length; i++) {
            if (myToken !== activePlayToken) return;
            const line = lines[i];
            if (line.isQuestion) {
              await playChime("question");
              if (myToken !== activePlayToken) return;
            }
            statusEl.textContent = `🎙️ 真人 AI 播放中（${line.speaker} ${i + 1}/${lines.length}）...`;
            await speakWithOpenAI(line.text, line.gender, rate, myToken);
            if (myToken !== activePlayToken) return;
            await new Promise(r => setTimeout(r, 420));
          }
          if (myToken === activePlayToken) statusEl.textContent = "✓ 播放完畢";
        } catch (err) {
          if (myToken === activePlayToken) {
            statusEl.textContent = "⚠️ " + (err.message || "AI 語音播放失敗");
          }
        }
        return;
      }

      // 瀏覽器高擬真神經網路語音模式
      if (!("speechSynthesis" in window)) {
        statusEl.textContent = "⚠️ 瀏覽器不支援語音，請點擊「顯示聽力原文」";
        return;
      }

      const fVoice = jaVoices.find(v => v.voiceURI === selectedFemaleVoiceURI) || jaVoices[0];
      const mVoice = jaVoices.find(v => v.voiceURI === selectedMaleVoiceURI) || jaVoices[0];
      const sameVoiceFallback = fVoice && mVoice && fVoice.voiceURI === mVoice.voiceURI;

      let idx = 0;
      async function speakNext() {
        if (myToken !== activePlayToken) return;
        if (idx >= lines.length) {
          statusEl.textContent = "✓ 播放完畢";
          return;
        }
        const line = lines[idx];
        if (line.isQuestion) {
          await playChime("question");
          if (myToken !== activePlayToken) return;
        }

        statusEl.textContent = `🔊 播放中（${line.speaker} ${idx + 1}/${lines.length}）...`;
        const speakContent = line.ttsText || line.text;
        const utter = new SpeechSynthesisUtterance(speakContent);
        utter.lang = "ja-JP";
        utter.voice = line.gender === "male" ? mVoice : fVoice;
        utter.rate = rate;
        // 若有獨立男女聲線，保持最自然的原音高 1.0；若被迫共用同一聲線才做極細微區隔
        utter.pitch = sameVoiceFallback
          ? (line.gender === "male" ? 0.94 : 1.03)
          : 1.0;

        utter.onend = () => {
          if (myToken !== activePlayToken) return;
          idx++;
          const pauseMs = (lines[idx] && lines[idx].isQuestion) ? 650 : 420;
          setTimeout(speakNext, pauseMs);
        };
        utter.onerror = () => {
          if (myToken === activePlayToken) {
            statusEl.textContent = "⚠️ 語音播放中斷或未安裝日語語音";
          }
        };
        window.speechSynthesis.speak(utter);
      }

      speakNext();
    }

    function toggleTranscript(qId) {
      const box = document.getElementById(`transcript-${qId}`);
      const btn = document.getElementById(`toggle-tr-${qId}`);

    }

    function changeEngineMode(mode) {
      engineMode = mode;
      document.getElementById("browserVoiceControls").style.display = mode === "browser" ? "flex" : "none";
      document.getElementById("openaiControls").style.display = mode === "openai" ? "flex" : "none";
    }

    function renderQuiz() {
      const root = document.getElementById("quizRoot");
      root.innerHTML = "";
      let renderedPassages = new Set();

      SECTIONS.forEach(sec => {
        const secQuestions = QUESTIONS.filter(q => q.section === sec.id);
        const visibleQuestions = secQuestions.filter(q => shouldShowQuestion(q));

        const banner = document.createElement("div");

        if (visibleQuestions.length === 0 && currentFilter !== "all") {
          banner.style.display = "none";
        }
        root.appendChild(banner);

        // 在聽力測驗區最上方加入「模擬真人發音引擎設定面板」
        if (sec.id === "sec-5" && (visibleQuestions.length > 0 || currentFilter === "all")) {
          const panel = document.createElement("div");
          panel.className = "voice-panel";
          panel.innerHTML = `
            <div class="voice-panel-title">
              <span>🎙️ 真人級聽力發音設定</span>
              <select class="voice-select" id="engineSelect" onchange="changeEngineMode(this.value)">
                <option value="browser" ${engineMode === "browser" ? "selected" : ""}>免費・高擬真瀏覽器神經語音（推薦 Edge）</option>
                <option value="openai" ${engineMode === "openai" ? "selected" : ""}>進階・OpenAI 真人 AI 主播語音（需 API Key）</option>
              </select>
            </div>
            <div class="voice-row" id="browserVoiceControls" style="display:${engineMode === "browser" ? "flex" : "none"}">
              <label>👩 女聲：
                <select class="voice-select" id="femaleVoiceSelect" onchange="selectedFemaleVoiceURI = this.value"></select>
              </label>

                <select class="voice-select" id="maleVoiceSelect" onchange="selectedMaleVoiceURI = this.value"></select>
              </label>
              <button class="btn-sm" onclick="testVoice('male')">試聽男聲</button>
            </div>
            <div class="voice-row" id="openaiControls" style="display:${engineMode === "openai" ? "flex" : "none"}">
              <label>OpenAI API Key：
                <input type="password" class="api-input" placeholder="sk-..." value="${openAiKey}" oninput="openAiKey = this.value.trim()" />
              </label>
              <button class="btn-sm" onclick="testVoice('female')">試聽 AI 女聲</button>

            <div class="voice-tip">

            </div>
          `;
          root.appendChild(panel);
          setTimeout(populateVoiceSelectors, 0);
        }

        secQuestions.forEach(q => {
          if (!shouldShowQuestion(q)) return;

          if (q.passageId && !renderedPassages.has(q.passageId)) {
            renderedPassages.add(q.passageId);
            const p = PASSAGES[q.passageId];
            const pCard = document.createElement("div");
            pCard.className = "passage-card";
            pCard.innerHTML = `<div class="passage-title">${p.title}</div><div>${p.text}</div>`;
            root.appendChild(pCard);
          }

          const card = document.createElement("div");
          card.className = "q-card";
          card.id = `card-${q.id}`;

          const userPick = userAnswers[q.id];
          const isAnswered = userPick !== undefined;
          const isCorrect = isAnswered && userPick === q.answer;
          if (isAnswered) {
            card.classList.add(isCorrect ? "correct-card" : "wrong-card");
          }

          let audioHTML = "";
          if (q.audioScript) {
            const trLines = q.audioScript.map(l => `<div class="transcript-line"><b>${l.speaker}：</b>${l.text}</div>`).join("");
            audioHTML = `
              <div class="audio-box">
                <div class="audio-controls">

                  <button class="btn-stop" onclick="stopAudio()">■ 停止</button>
                  <select class="speed-select" id="speed-${q.id}" aria-label="語速">
                    <option value="0.8">0.8x 慢速清晰</option>
                    <option value="0.95" selected>0.95x 真人自然</option>
                    <option value="1.05">1.05x 略快</option>
                  </select>
                  <button class="btn-sm" id="toggle-tr-${q.id}" onclick="toggleTranscript(${q.id})">👁️ 顯示聽力原文</button>
                  <span class="audio-status" id="status-${q.id}"></span>
                </div>
                <div class="transcript-box" id="transcript-${q.id}">${trLines}</div>
              </div>
            `;
          }

          const optionsHTML = q.options.map((opt, idx) => {
            let cls = "opt-btn";
            if (isAnswered) {
              if (idx === q.answer) cls += " is-correct";
              else if (idx === userPick) cls += " is-wrong";
            }
            return `
              <button class="${cls}" ${isAnswered ? "disabled" : ""} onclick="selectOption(${q.id}, ${idx})">
                <span class="opt-index">${idx + 1}</span>
                <span>${opt}</span>
              </button>
            `;
          }).join("");

          let fbClass = "feedback-box";
          let fbTitle = "";
          if (isAnswered) {
            fbClass += " show " + (isCorrect ? "correct" : "wrong");
            fbTitle = isCorrect
              ? "✅ 答對了！"
              : `❌ 答錯了！正確答案是選項 ${q.answer + 1}（${q.options[q.answer]}）`;
          }

          card.innerHTML = `
            <div class="q-header">
              <div><span class="q-num">第 ${q.id} 題</span></div>
              <span class="q-tag">${q.tag}</span>

            <div class="q-prompt">${q.prompt}</div>
            <div class="options-grid">${optionsHTML}</div>
            <div class="${fbClass}" id="fb-${q.id}">
              <div class="feedback-top">
                <span>${fbTitle}</span>
                <button class="retry-btn" onclick="retryQuestion(${q.id})">↺ 重答此題</button>
              </div>
              <div><b>解析：</b>${q.explanation}</div>
            </div>
          `;

          root.appendChild(card);
        });
      });

      updateStats();
    }

    function shouldShowQuestion(q) {
      const answered = userAnswers[q.id] !== undefined;
      if (currentFilter === "unanswered") return !answered;
      if (currentFilter === "wrong") return answered && userAnswers[q.id] !== q.answer;
      return true;
    }

    function selectOption(qId, optIdx) {
      userAnswers[qId] = optIdx;
      renderQuiz();
    }

    function retryQuestion(qId) {
      delete userAnswers[qId];
      renderQuiz();
    }

    function setFilter(mode) {
      currentFilter = mode;
      document.querySelectorAll(".filter-btns .btn-sm").forEach(b => b.classList.remove("active"));
      const activeBtn = document.getElementById(`filter-${mode}`);
      if (activeBtn) activeBtn.classList.add("active");
      renderQuiz();
    }

    function resetAll() {
      if (Object.keys(userAnswers).length > 0 && !confirm("確定要清除所有作答紀錄並重新開始嗎？")) {
        return;
      }
      stopAudio();
      for (const k in userAnswers) delete userAnswers[k];
      setFilter("all");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function jumpTo(id) {
      if (currentFilter !== "all") setFilter("all");
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          const y = el.getBoundingClientRect().top + window.scrollY - 130;
          window.scrollTo({ top: y, behavior: "smooth" });
        }
      }, 30);
    }

    function updateStats() {
      const total = QUESTIONS.length;
      const answeredIds = Object.keys(userAnswers).map(Number);
      const answeredCount = answeredIds.length;
      let correctCount = 0;
      answeredIds.forEach(id => {
        const q = QUESTIONS.find(item => item.id === id);
        if (q && userAnswers[id] === q.answer) correctCount++;
      });
      const wrongCount = answeredCount - correctCount;
      const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      document.getElementById("answeredBadge").textContent = `已答 ${answeredCount} / ${total}`;
      document.getElementById("correctBadge").textContent = `答對 ${correctCount} 題`;
      document.getElementById("wrongBadge").textContent = `答錯 ${wrongCount} 題`;
      document.getElementById("rateBadge").textContent = `正確率 ${rate}%`;
      document.getElementById("progressBar").style.width = `${(answeredCount / total) * 100}%`;

      const summaryText = document.getElementById("summaryText");
      if (answeredCount === 0) {
        summaryText.textContent = "作答任一題後即可立即顯示對錯與詳解，系統會在此為您即時統計各單元表現。";
      } else if (answeredCount < total) {
        summaryText.textContent = `目前已完成 ${answeredCount} / ${total} 題（正確率 ${rate}%），繼續加油！`;
      } else {
        const finalScore = Math.round((correctCount / total) * 100);
        const comment = finalScore >= 80
          ? "🎉 表現優異！您的 N5 核心單字、助詞與文法陷阱都掌握得非常穩固！"
          : finalScore >= 60
          ? "👍 已達基礎水準！建議切換「只看錯題」複習錯題對應的教材單元。"
          : "💪 還有進步空間！建議搭配您的 N5 整理講義，針對答錯率較高的單元加強練習。";
        summaryText.innerHTML = `<b>測驗完成！總分：${finalScore} 分（答對 ${correctCount} / ${total} 題）</b><br>${comment}`;
      }

      const grid = document.getElementById("summaryGrid");
      grid.innerHTML = SECTIONS.map(sec => {
        const qs = QUESTIONS.filter(q => q.section === sec.id);
        let secAns = 0, secOk = 0;
        qs.forEach(q => {
          if (userAnswers[q.id] !== undefined) {
            secAns++;
            if (userAnswers[q.id] === q.answer) secOk++;
          }
        });
        const shortTitle = sec.title.split("（")[0];
        return `
          <div class="summary-item">
            <div class="sec-name">${shortTitle}</div>
            <div class="sec-score">${secOk} / ${qs.length}</div>
            <div style="font-size:0.78rem; color:var(--muted);">已答 ${secAns} 題</div>
          </div>
        `;
      }).join("");
    }

    renderQuiz();
  </script>
</body>
</html>
