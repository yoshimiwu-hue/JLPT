<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT 日語學習與測驗中心</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            color: #bdc3c7;
            font-size: 1.1rem;
        }
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .section-title:first-child {
            margin-top: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 5px solid var(--accent-color);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.25rem;
        }
        .card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            padding: 0.6rem 1rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #e9ecef;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>JLPT 日語學習與測驗中心</h1>
        <p>請選擇您想練習的級別與單元</p>
    </header>

    <main>
        <!-- N5 專區 -->
        <h2 class="section-title" style="border-color: #e74c3c;">🎯 N5 基礎級別</h2>
        <div class="grid-container">
            <div class="card" style="border-left-color: #e74c3c;">
                <div>
                    <h3>N5 測驗</h3>
                    <p>基礎文法、文字與讀解綜合模擬測驗。</p>
                </div>
                <a href="n5/test/index.html" class="btn" style="background-color: #e74c3c;">開始測驗</a>
            </div>

            <div class="card" style="border-left-color: #e74c3c;">
                <div>
                    <h3>N5 單字聽力練習</h3>
                    <p>核心單字、真人語音盲聽與聽寫特訓。</p>
                </div>
                <a href="n5/listening/index.html" class="btn" style="background-color: #e74c3c;">開始練習</a>
            </div>
        </div>

        <!-- N4 專區 -->
        <h2 class="section-title" style="border-color: #f39c12;">🚀 N4 進階級別</h2>
        <div class="grid-container">
            <div class="card" style="border-left-color: #f39c12;">
                <div>
                    <h3>N4 測驗</h3>
                    <p>進階基礎文法與實用閱讀能力測驗。</p>
                </div>
                <a href="n4/test/index.html" class="btn" style="background-color: #f39c12;">開始測驗</a>
            </div>

            <div class="card" style="border-left-color: #f39c12;">
                <div>
                    <h3>N4 單字聽力練習</h3>
                    <p>生活常用單字與短句聽力強化訓練。</p>
                </div>
                <a href="n4/listening/index.html" class="btn" style="background-color: #f39c12;">開始練習</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 台灣英里留學社 - JLPT 學習平台 All Rights Reserved.</p>
    </footer>

</body>
</html>
