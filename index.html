<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 學習中心</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 { margin: 0 0 0.5rem 0; font-size: 2.2rem; }
        header p { margin: 0; color: #bdc3c7; font-size: 1.1rem; }
        main {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 3rem auto;
            padding: 0 1rem;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 5px solid #3498db;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin-top: 0; color: #2c3e50; font-size: 1.4rem; }
        .card p { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .btn:hover { background-color: #2980b9; }
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #e9ecef;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>JLPT N5 學習與測驗中心</h1>
        <p>請選擇您想進行的學習單元</p>
    </header>

    <main>
        <div class="card" style="border-top-color: #e74c3c;">
            <h3>✍️ N5 模擬測驗</h3>
            <p>文法與文字綜合模擬測驗，自我檢測實力。</p>
            <a href="n5/n5-test.html" class="btn" style="background-color: #e74c3c;">開始測驗</a>
        </div>

        <div class="card" style="border-top-color: #27ae60;">
            <h3>🎧 N5 單字聽力</h3>
            <p>255個核心單字盲聽、拼寫與真人語音特訓。</p>
            <a href="n5/n5-listening.html" class="btn" style="background-color: #27ae60;">開始練習</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 台灣英里留學社 - JLPT 學習平台 All Rights Reserved.</p>
    </footer>

</body>
</html>
